services:
  db:
    image: postgres:16-alpine
    container_name: turfmatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: turfmatch
      POSTGRES_USER: turfmatch
      POSTGRES_PASSWORD: turfmatch
    ports:
      - "5432:5432"
    volumes:
      - turfmatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turfmatch -d turfmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turfmatch_postgres_data:
